<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-labelledby="title desc">
<title id="title">DAHN: alternating Slot and Visualizer composition</title>
<desc id="desc">A repeating chain of Slot, Visualizer, child Slot, child Visualizer and further child Slot. Each Visualizer fulfills the contract of its containing Slot and declares child Slots. VisualizerUsage associates an agent-relative choice and configuration with a Slot and Visualizer. Applicability links a Visualizer to a TypeDescriptor. A proposed collective VisualizerProfile attaches evidence to a Visualizer and subject Type.</desc>
<defs>
<marker id="slot" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#14747b"/></marker>
<marker id="viz" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4655b4"/></marker>
<marker id="usage" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#9a6216"/></marker>
<marker id="profile" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8250ac"/></marker>
</defs><rect width="1800" height="960" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#24344c">
<text x="900" y="65" text-anchor="middle" font-size="42" fill="#24344c" font-weight="bold">DAHN · Composing an agent’s experience</text>
<text x="900" y="111" text-anchor="middle" font-size="26" fill="#61748d">Slots declare contracts. Visualizers fulfill them and introduce child Slots.</text>
<rect x="930" y="165" width="440" height="120" rx="17" fill="#fff2dd" stroke="#9a6216" stroke-width="2.5"/>
<text x="1150.0" y="214" text-anchor="middle" font-size="29" fill="#9a6216" font-weight="bold">VisualizerUsage</text>
<text x="1150.0" y="247" text-anchor="middle" font-size="20" fill="#9a6216">Agent-relative choice + configuration</text>
<path d="M1030 285 L900 340 L900 420" fill="none" stroke="#9a6216" stroke-width="2.5" marker-end="url(#usage)"/>
<path d="M1260 285 L1270 340 L1270 420" fill="none" stroke="#9a6216" stroke-width="2.5" marker-end="url(#usage)"/>
<text x="850" y="334" text-anchor="middle" font-size="19" fill="#9a6216">SelectedForSlot</text>
<text x="1360" y="334" text-anchor="middle" font-size="19" fill="#9a6216">UsesVisualizer</text>
<rect x="40" y="420" width="240" height="120" rx="17" fill="#e5f3f3" stroke="#14747b" stroke-width="2.5"/>
<text x="160.0" y="469" text-anchor="middle" font-size="29" fill="#14747b" font-weight="bold">Slot</text>
<text x="160.0" y="502" text-anchor="middle" font-size="20" fill="#14747b">Required contract</text>
<rect x="410" y="420" width="240" height="120" rx="17" fill="#eaedff" stroke="#4655b4" stroke-width="2.5"/>
<text x="530.0" y="469" text-anchor="middle" font-size="29" fill="#4655b4" font-weight="bold">Visualizer</text>
<text x="530.0" y="502" text-anchor="middle" font-size="20" fill="#4655b4">Selected capability</text>
<rect x="780" y="420" width="240" height="120" rx="17" fill="#e5f3f3" stroke="#14747b" stroke-width="2.5"/>
<text x="900.0" y="469" text-anchor="middle" font-size="29" fill="#14747b" font-weight="bold">Slot</text>
<text x="900.0" y="502" text-anchor="middle" font-size="20" fill="#14747b">Required child contract</text>
<rect x="1150" y="420" width="240" height="120" rx="17" fill="#eaedff" stroke="#4655b4" stroke-width="2.5"/>
<text x="1270.0" y="469" text-anchor="middle" font-size="29" fill="#4655b4" font-weight="bold">Visualizer</text>
<text x="1270.0" y="502" text-anchor="middle" font-size="20" fill="#4655b4">Selected child capability</text>
<rect x="1520" y="420" width="240" height="120" rx="17" fill="#e5f3f3" stroke="#14747b" stroke-width="2.5"/>
<text x="1640.0" y="469" text-anchor="middle" font-size="29" fill="#14747b" font-weight="bold">Slot</text>
<text x="1640.0" y="502" text-anchor="middle" font-size="20" fill="#14747b">Further child contract</text>
<path d="M410 480 L280 480" fill="none" stroke="#14747b" stroke-width="2.5" marker-end="url(#slot)"/>
<text x="345.0" y="377" text-anchor="middle" font-size="22" fill="#24344c">Fulfills</text>
<text x="345.0" y="406" text-anchor="middle" font-size="22" fill="#24344c">contract</text>
<path d="M650 480 L780 480" fill="none" stroke="#14747b" stroke-width="2.5" marker-end="url(#slot)"/>
<text x="715.0" y="406" text-anchor="middle" font-size="22" fill="#24344c">ChildSlots</text>
<path d="M1150 480 L1020 480" fill="none" stroke="#14747b" stroke-width="2.5" marker-end="url(#slot)"/>
<text x="1085.0" y="377" text-anchor="middle" font-size="22" fill="#24344c">Fulfills</text>
<text x="1085.0" y="406" text-anchor="middle" font-size="22" fill="#24344c">contract</text>
<path d="M1390 480 L1520 480" fill="none" stroke="#14747b" stroke-width="2.5" marker-end="url(#slot)"/>
<text x="1455.0" y="406" text-anchor="middle" font-size="22" fill="#24344c">ChildSlots</text>
<rect x="350" y="690" width="360" height="120" rx="17" fill="#edf1f7" stroke="#536580" stroke-width="2.5"/>
<text x="530.0" y="739" text-anchor="middle" font-size="29" fill="#536580" font-weight="bold">TypeDescriptor</text>
<text x="530.0" y="772" text-anchor="middle" font-size="20" fill="#536580">e.g., HolonType or ValueType</text>
<path d="M530 540 L530 690" fill="none" stroke="#4655b4" stroke-width="2.5" marker-end="url(#viz)"/>
<text x="659" y="611" text-anchor="middle" font-size="22" fill="#4655b4">ApplicableToType</text>
<rect x="1070" y="690" width="440" height="120" rx="17" fill="#f3eafa" stroke="#8250ac" stroke-width="2.5"/>
<text x="1290.0" y="739" text-anchor="middle" font-size="29" fill="#8250ac" font-weight="bold">VisualizerProfile</text>
<text x="1290.0" y="772" text-anchor="middle" font-size="20" fill="#8250ac">Proposed · collective evidence + metrics</text>
<path d="M1270 690 L1270 540" fill="none" stroke="#8250ac" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#profile)"/>
<text x="1400" y="612" text-anchor="middle" font-size="21" fill="#8250ac">Profiles Visualizer</text>
<path d="M1070 750 L710 750" fill="none" stroke="#8250ac" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#profile)"/>
<text x="891" y="726" text-anchor="middle" font-size="21" fill="#8250ac">For subject Type</text>
<text x="1290" y="848" text-anchor="middle" font-size="21" fill="#8250ac">Community scope · popularity · trending</text>
<text x="1290" y="877" text-anchor="middle" font-size="21" fill="#8250ac">Exposure and selection counts</text>
<text x="645" y="870" text-anchor="middle" font-size="25" fill="#24344c" font-weight="bold">The composition pattern repeats;</text>
<text x="645" y="904" text-anchor="middle" font-size="25" fill="#24344c" font-weight="bold">Usage and Profile attach to it.</text>
<text x="900" y="943" text-anchor="middle" font-size="18" fill="#61748d">Representative attachments shown once. ChildSlots and fulfillment are conceptual; dashed Profile relationships are proposed schema.</text>
</g></svg>
