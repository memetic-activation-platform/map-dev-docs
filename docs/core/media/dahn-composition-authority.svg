<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">DAHN composition and local authority</title><desc id="desc">Illustrative recursive composition. Space Navigator binds local HolonSpace; DAHN selects at each slot. Agent-relative usage informs selection but does not fulfill slots. Structure specializations are peers.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#355c7d"/></marker></defs><rect width="1200" height="810" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="35" y="42" font-size="26" font-weight="bold">DAHN: composition contracts and selected experience</text><rect x="35" y="75" width="350" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="51" y="104" font-size="18" font-weight="bold">Agent participation</text><text x="51" y="130" font-size="15">Preferences, configuration, explicit choices</text><text x="51" y="152" font-size="15">VisualizerUsage is agent-relative</text><text x="51" y="174" font-size="15">Usage informs selection; it does not fill slots</text><rect x="425" y="75" width="350" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="441" y="104" font-size="18" font-weight="bold">DAHN selection at every slot</text><text x="441" y="130" font-size="15">Accepted types + subject applicability</text><text x="441" y="152" font-size="15">Context, theme, security and policy</text><text x="441" y="174" font-size="15">Selected Visualizer fulfills the contract</text><rect x="815" y="75" width="350" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="831" y="104" font-size="18" font-weight="bold">Bound subject</text><text x="831" y="130" font-size="15">Identity, type, topology and context</text><text x="831" y="152" font-size="15">Actual data binds to the selected Visualizer</text><text x="831" y="174" font-size="15">Owner supplies the subject for its slot</text><path d="M385 135 L425 135" stroke="#355c7d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M815 135 L775 135" stroke="#355c7d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="35" y="240" font-size="20" font-weight="bold">Illustrative recursive composition — each arrow crosses a selected slot boundary</text><rect x="35" y="265" width="260" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="51" y="294" font-size="18" font-weight="bold">Space Navigator</text><text x="51" y="320" font-size="15">Dancer owns direct roles</text><text x="51" y="342" font-size="15">RootedNavigation slot</text><text x="51" y="364" font-size="15">Subject: local HolonSpace</text><rect x="325" y="265" width="260" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="341" y="294" font-size="18" font-weight="bold">Path Inspector</text><text x="341" y="320" font-size="15">Fulfills RootedNavigation</text><text x="341" y="342" font-size="15">Node slot: occurrence Holon</text><text x="341" y="364" font-size="15">Root: any compatible Holon</text><rect x="615" y="265" width="260" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="631" y="294" font-size="18" font-weight="bold">Holon Inspector</text><text x="631" y="320" font-size="15">Fulfills Node contract</text><text x="631" y="342" font-size="15">Owns private child composition</text><text x="631" y="364" font-size="15">CollectionViewer: collection</text><rect x="905" y="265" width="260" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="921" y="294" font-size="18" font-weight="bold">Table Collection</text><text x="921" y="320" font-size="15">Fulfills Collection contract</text><text x="921" y="342" font-size="15">Owns rows, sorting and cells</text><text x="921" y="364" font-size="15">Value child: typed cell value</text><path d="M295 325 L325 325" stroke="#355c7d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M585 325 L615 325" stroke="#355c7d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M875 325 L905 325" stroke="#355c7d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="425" y="425" width="350" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="441" y="454" font-size="18" font-weight="bold">PropertyMap child</text><text x="441" y="480" font-size="15">Holon Inspector binds property facet</text><text x="441" y="502" font-size="15">PropertyMap owns label/value pairing</text><text x="441" y="524" font-size="15">May select String labels + typed Values</text><path d="M745 385 L745 425" stroke="#355c7d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="815" y="425" width="350" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="831" y="454" font-size="18" font-weight="bold">Local responsibility</text><text x="831" y="480" font-size="15">Parent owns external child allocation</text><text x="831" y="502" font-size="15">Child owns internal experience</text><text x="831" y="524" font-size="15">Pane and Node restore states are separate</text><text x="35" y="598" font-size="20" font-weight="bold">VisualizerKind hierarchy (subset)</text><rect x="35" y="625" width="350" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="51" y="654" font-size="18" font-weight="bold">Structure</text><text x="51" y="680" font-size="15">Peer specializations:</text><text x="51" y="702" font-size="15">Graph · Geospatial · RootedNavigation</text><text x="51" y="724" font-size="15">Path Inspector fulfills RootedNavigation</text><rect x="425" y="625" width="350" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="441" y="654" font-size="18" font-weight="bold">Other families</text><text x="441" y="680" font-size="15">Node → Holon Inspector</text><text x="441" y="702" font-size="15">Collection → Table Collection</text><text x="441" y="724" font-size="15">PropertyMap; Value → String</text><rect x="815" y="625" width="350" height="120" rx="12" fill="#e6f2ff" stroke="#7193b3"/><text x="831" y="654" font-size="18" font-weight="bold">Substitutability</text><text x="831" y="680" font-size="15">Slots belong to their composition owner</text><text x="831" y="702" font-size="15">Kind membership is not full conformance</text><text x="831" y="724" font-size="15">Concrete geometry stays with its owner</text></g></svg>